<!-- Página de assinatura -->
<!DOCTYPE html>
<html>
<head>
    <title>Assinatura</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <h1>Libere seu acesso</h1>
    <p>Consultas ilimitadas por R$ 9,90/mês</p>
    <button id="pagar">PAGAR COM PIX</button>
    
    <script>
        document.getElementById('pagar').addEventListener('click', async () => {
            const response = await fetch('/gerar-pagamento', {method: 'POST'});
            const {payment_url} = await response.json();
            window.location.href = payment_url;
        });
    </script>
</body>
</html>
